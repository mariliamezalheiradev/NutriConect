# Banco de dados PostgreSQL (valores padrao para desenvolvimento local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nutriconect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Chave da API do Gemini: defina a variavel de ambiente GEMINI_API_KEY (nunca escreva a chave aqui)
gemini.api.key=${GEMINI_API_KEY:}
